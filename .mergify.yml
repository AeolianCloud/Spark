# Mergify 自动合并机器人配置
#
# 流程：PR 打开后，CI（frontend / build）通过即由 mergify[bot] 自动 approve；
# 同时满足「CI 通过 + 已批准」后自动入队，以 squash 方式合并并删除源分支。
#
# 依赖：仓库已安装 Mergify app（写权限）；分支保护要求 1 个 review
#（由 mergify[bot] 的 review action 满足）。

queue_rules:
  - name: default
    merge_method: squash
    update_method: rebase
    conditions:
      # 队列合并前再次确认 CI 通过（strict 模式下会先更新 base 再合并）
      - check-success = frontend / build

pull_request_rules:
  # 规则 1：CI 通过后自动 approve（mergify[bot] 的批准计入分支保护的 review 要求）
  - name: auto-approve-when-ci-passes
    conditions:
      - check-success = frontend / build
      - base = master
      - -draft
    actions:
      review:
        type: APPROVE

  # 规则 2：CI 通过且有批准后自动入队合并（squash + 删分支）
  - name: auto-merge-when-approved
    conditions:
      - check-success = frontend / build
      - "#approved-reviews-by>=1"
      - base = master
      - -draft
      - -conflict
    actions:
      queue:
        name: default

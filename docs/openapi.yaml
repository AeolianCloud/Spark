# Spark PVE Management API — OpenAPI 3.0 契约
#
# 本文件是 API 契约的机器可读形态，与 api/router.go、api/handlers/*.go、
# docs/api-errors.md 保持一致。修改任何端点/字段必须同步更新本文件。
#
# 契约要点：
# - 列表端点统一分页：limit（默认 25，上限 100，超出截断）、offset（默认 0），
#   非法值（负数/非数字）返回 400 bad_request；响应头 X-Total-Count 携带过滤
#   前的总条数。
# - 所有错误响应统一 {"error": {"code", "message"}} 结构，并携带
#   x-ms-error-code 响应头（值与 code 一致）。错误码清单见
#   components.schemas.ErrorDetail.code 枚举与 docs/api-errors.md。
# - 未匹配路由的 404（not_found）与 405（method_not_allowed，带 Allow 头）
#   为全局兜底，覆盖全部路径。
# - 生命周期操作（start/stop/restart）202 响应携带 Location 指向状态终结点
#   GET /vms/{id}（数字本地行 id 与 external 合成标识 ext-{nodeID}-{vmid}
#   均可，详情端点两者都支持）。
# - 镜像下载（POST /images/{id}/download）202 响应携带 Location 指向操作
#   历史 GET /images/{id}/operations，供前端轮询下载进度。
openapi: 3.0.3
# 许可证说明：内部项目尚未确定 LICENSE 声明，暂不声明 license 字段
#（info-license 豁免记录于 .redocly.lint-ignore.yaml）。
info:
  title: Spark PVE Management API
  version: 1.0.0
  description: |
    基于 Proxmox VE 的虚拟化管理后端 REST 接口：VM 全生命周期管理（创建/列表/
    详情/启停/重启/升降配/销毁）、区域与 PVE 节点管理、IP 池管理、存储抽象与
    cloud 镜像目录管理。状态穿透式：VM 实时状态每次查询时读取自 PVE 节点。

    错误契约：所有错误响应统一为 {"error": {"code", "message"}} 结构，并携带
    x-ms-error-code 响应头（值与 code 一致）。code 是唯一可依赖的机器可读标识，
    message 仅供人阅读。未匹配路由的 404 与 405（带 Allow 头）也是契约一部分。

    分页约定：列表端点支持 limit/offset 查询参数，limit 默认 25、上限 100
    （超出截断）、offset 默认 0；非法值返回 400。分页响应头 X-Total-Count
    为过滤后（分页前）的总条数。
servers:
  # 相对路径：当前按同一来源部署（前端与 API 同源）；生产部署后调整为
  # 实际前缀，如 https://api.example.com（v1 无版本前缀，见 design.md）。
  - url: /

tags:
  - name: zones
    description: 区域（zone）与 PVE 节点管理
  - name: ip-pools
    description: IP 池管理
  - name: storage-types
    description: 存储抽象管理
  - name: images
    description: cloud 镜像目录管理
  - name: vms
    description: 云主机（VM）生命周期管理
  - name: system
    description: 健康检查

# 当前 API 未接入认证：空 security 数组声明所有操作无安全要求
#（OpenAPI 3.0 语义，根级空数组 = 无需任何认证/授权）；
# 未来引入认证后在此声明 securitySchemes 并替换为具体方案。
security: []

paths:
  /healthz:
    get:
      tags: [system]
      summary: 健康检查（含数据库连通性）
      operationId: healthz
      description: |
        探活端点，不属于业务 API：200 正常响应不携带 x-ms-error-code 头；
        503 degraded 响应携带 x-ms-error-code: service_unavailable。
      # 探活端点按设计无 4XX 响应（仅 200 正常 / 503 degraded，与
      # api/handlers/health.go 一致），operation-4xx-response 豁免记录于
      # .redocly.lint-ignore.yaml。
      responses:
        "200":
          description: 服务与数据库均正常
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: 数据库探活失败（degraded）
          headers:
            x-ms-error-code:
              $ref: "#/components/headers/XMSErrorCode"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /zones:
    post:
      tags: [zones]
      summary: 创建区域
      operationId: createZone
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ZoneCreateRequest"
      responses:
        "201":
          description: 创建成功
          headers:
            Location:
              $ref: "#/components/headers/Location"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ZoneResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
    get:
      tags: [zones]
      summary: 区域列表（含各区域完整节点列表）
      operationId: listZones
      parameters:
        - $ref: "#/components/parameters/QueryLimit"
        - $ref: "#/components/parameters/QueryOffset"
      responses:
        "200":
          description: 分页后的区域列表
          headers:
            X-Total-Count:
              $ref: "#/components/headers/XTotalCount"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ZoneResponse"
        "400":
          $ref: "#/components/responses/BadRequest"

  /zones/{zone_id}/nodes:
    post:
      tags: [zones]
      summary: 登记 PVE 节点
      operationId: createNode
      parameters:
        - $ref: "#/components/parameters/PathZoneID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NodeRequest"
      responses:
        "201":
          description: 登记成功
          headers:
            Location:
              $ref: "#/components/headers/Location"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NodeResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    get:
      tags: [zones]
      summary: 区域节点列表
      operationId: listNodesByZone
      parameters:
        - $ref: "#/components/parameters/PathZoneID"
      responses:
        "200":
          description: 该区域的节点列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NodeResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /nodes/{id}:
    put:
      tags: [zones]
      summary: 更新节点
      description: 空 api_token 保留原密钥；enabled 缺省时保留现值。
      operationId: updateNode
      parameters:
        - $ref: "#/components/parameters/PathID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NodeRequest"
      responses:
        "200":
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NodeResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /nodes/{id}/status:
    get:
      tags: [zones]
      summary: 查询节点实时状态
      description: |
        实时拉取 PVE 节点状态并聚合返回：节点配置字段（与 NodeResponse
        平铺一致）+ 嵌套 status 对象（在线状态、PVE 版本/内核、在线时长、
        CPU/内存/根分区使用率与负载、网络接口列表及实时吞吐）。
        :id 为本地 pve_nodes.id。节点不存在返回 404 not_found；PVE
        不可达/令牌无效/超时返回 503 node_unavailable（错误消息脱敏）。
      operationId: getNodeStatus
      parameters:
        - $ref: "#/components/parameters/PathID"
      responses:
        "200":
          description: 节点配置 + 实时状态
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NodeStatusResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /ip-pools:
    post:
      tags: [ip-pools]
      summary: 创建 IP 池（自动展开为逐地址记录）
      operationId: createPool
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePoolRequest"
      responses:
        "201":
          description: 创建成功
          headers:
            Location:
              $ref: "#/components/headers/Location"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pool"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    get:
      tags: [ip-pools]
      summary: IP 池列表（可按区域过滤）
      operationId: listPools
      parameters:
        - $ref: "#/components/parameters/QueryZoneID"
        - $ref: "#/components/parameters/QueryLimit"
        - $ref: "#/components/parameters/QueryOffset"
      responses:
        "200":
          description: 分页后的 IP 池列表
          headers:
            X-Total-Count:
              $ref: "#/components/headers/XTotalCount"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Pool"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /ip-pools/{id}/nodes:
    put:
      tags: [ip-pools]
      summary: 设置 IP 池的节点白名单（整体替换）
      operationId: setPoolNodes
      parameters:
        - $ref: "#/components/parameters/PathID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetPoolNodesRequest"
      responses:
        "200":
          description: 替换成功，返回替换后的白名单
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NodeResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    get:
      tags: [ip-pools]
      summary: 获取 IP 池的节点白名单
      operationId: getPoolNodes
      parameters:
        - $ref: "#/components/parameters/PathID"
      responses:
        "200":
          description: 白名单节点列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NodeResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /storage-types:
    post:
      tags: [storage-types]
      summary: 登记存储类型
      operationId: createStorageType
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StorageTypeRequest"
      responses:
        "201":
          description: 登记成功
          headers:
            Location:
              $ref: "#/components/headers/Location"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageType"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
    get:
      tags: [storage-types]
      summary: 存储类型列表
      operationId: listStorageTypes
      parameters:
        - $ref: "#/components/parameters/QueryLimit"
        - $ref: "#/components/parameters/QueryOffset"
      responses:
        "200":
          description: 分页后的存储类型列表
          headers:
            X-Total-Count:
              $ref: "#/components/headers/XTotalCount"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StorageType"
        "400":
          $ref: "#/components/responses/BadRequest"

  /storage-types/{id}:
    get:
      tags: [storage-types]
      summary: 存储类型详情
      operationId: getStorageType
      parameters:
        - $ref: "#/components/parameters/PathID"
      responses:
        "200":
          description: 存储类型详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageType"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [storage-types]
      summary: 更新存储类型
      operationId: updateStorageType
      parameters:
        - $ref: "#/components/parameters/PathID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StorageTypeRequest"
      responses:
        "200":
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageType"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      tags: [storage-types]
      summary: 删除存储类型
      operationId: deleteStorageType
      parameters:
        - $ref: "#/components/parameters/PathID"
      responses:
        "204":
          description: 删除成功，无响应体
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /images:
    post:
      tags: [images]
      summary: 登记 cloud 镜像
      operationId: createImage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImageRequest"
      responses:
        "201":
          description: 登记成功
          headers:
            Location:
              $ref: "#/components/headers/Location"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Image"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
    get:
      tags: [images]
      summary: 镜像列表（可选区域过滤）
      description: |
        不带 ?zone_id= 时返回全部已注册镜像（[]Image）；带 ?zone_id= 时
        返回该区域内至少一个启用节点存在该镜像的条目（[]ImageZoneItem：
        镜像元数据 + 各启用节点存在状态；单节点扫描失败降级为"未下载"）。
        两种分支的响应结构不同（见 200 响应 oneOf），均分页并设置
        X-Total-Count（各分支结果集的总数）。zone_id 非法返回 400
        bad_request；区域不存在返回 404 not_found。
      operationId: listImages
      parameters:
        - $ref: "#/components/parameters/QueryZoneID"
        - $ref: "#/components/parameters/QueryLimit"
        - $ref: "#/components/parameters/QueryOffset"
      responses:
        "200":
          description: 分页后的镜像列表（响应结构随 zone_id 是否提供而不同）
          headers:
            X-Total-Count:
              $ref: "#/components/headers/XTotalCount"
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
                    description: 不带 zone_id 时的全部镜像
                    items:
                      $ref: "#/components/schemas/Image"
                  - type: array
                    description: 带 zone_id 时的区域可用镜像（镜像 + 各节点存在状态）
                    items:
                      $ref: "#/components/schemas/ImageZoneItem"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /images/{id}:
    get:
      tags: [images]
      summary: 镜像详情
      description: |
        返回指定 id 的镜像元数据（id、name、default_user、download_url、
        created_at）。POST /images 的 201 Location 头即指向本端点。镜像
        不存在返回 404 not_found；id 非法返回 400 bad_request。
      operationId: getImage
      parameters:
        - $ref: "#/components/parameters/PathID"
      responses:
        "200":
          description: 镜像详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Image"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /images/{id}/nodes-status:
    get:
      tags: [images]
      summary: 查询镜像在各启用节点上的存在状态
      description: |
        返回该镜像在各启用节点上的存在状态数组（[]NodeImageStatus）：不带
        ?zone_id= 时扫描全部启用节点；带时限定为该区域的启用节点（区域
        不存在返回 404 not_found）。镜像不存在返回 404 not_found。单节点
        扫描失败降级为"未下载"（downloaded=false），不会令整个请求失败。
      operationId: listImageNodeStatus
      parameters:
        - $ref: "#/components/parameters/PathID"
        - $ref: "#/components/parameters/QueryZoneID"
      responses:
        "200":
          description: 各启用节点上的镜像存在状态
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NodeImageStatus"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /images/{id}/download:
    post:
      tags: [images]
      summary: 受理镜像下载（异步执行）
      description: |
        将镜像下载到目标节点（node_ids 显式列表或 zone_id 区域全部启用
        节点，二选一）：返回 202 Accepted 与本次创建的每节点一条 running
        操作记录（[]ImageOperation），下载在后台按节点独立执行，终态
        （success/failed）写回操作记录。Location 头指向
        GET /images/{id}/operations，供前端轮询下载进度。

        同一镜像同一节点存在未终态（running）下载时，重复受理返回 409
        conflict；并发提交存在竞态窗口，可能产生重复记录（调用方自行去重）。

        错误场景：400 node_ids 与 zone_id 同时提供或都不提供、download_url
        非 http(s)（均 bad_request）；409 目标节点已有该镜像 running 下载
        （conflict，幂等拒绝）；404 镜像/节点/区域不存在（not_found）。
      operationId: downloadImage
      parameters:
        - $ref: "#/components/parameters/PathID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImageDownloadRequest"
      responses:
        "202":
          description: 已受理；Location 指向下载操作历史 GET /images/{id}/operations
          headers:
            Location:
              $ref: "#/components/headers/Location"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ImageOperation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "404":
          $ref: "#/components/responses/NotFound"

  /images/{id}/operations:
    get:
      tags: [images]
      summary: 查询镜像下载操作历史（按时间倒序分页）
      description: |
        返回该镜像的下载操作记录（每次 POST /images/{id}/download 每节点
        各一条），按时间倒序分页；镜像不存在返回 404 not_found。分页语义
        与列表一致：limit 默认 25 上限 100，X-Total-Count 报告匹配总数
        （分页前）。前端可用它轮询 Download 202 响应中 Location 头指向
        的进度。
      operationId: listImageOperations
      parameters:
        - $ref: "#/components/parameters/PathID"
        - $ref: "#/components/parameters/QueryLimit"
        - $ref: "#/components/parameters/QueryOffset"
      responses:
        "200":
          description: 分页后的下载操作记录（按时间倒序）
          headers:
            X-Total-Count:
              $ref: "#/components/headers/XTotalCount"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ImageOperation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /vms:
    post:
      tags: [vms]
      summary: 创建 VM
      description: |
        分配 IP → 落库 → 异步 PVE 创建链，立即返回 201（status 为 creating）。
        密码仅用于 cloud-init 一次性注入，不随响应返回。

        错误场景：400 请求体非法，或镜像在该区域不可用（image_not_available_in_zone）；
        404 区域/镜像/存储类型不存在（not_found）；409 IP 池地址耗尽（ip_exhausted）；
        503 所有候选节点不可达或被禁用（node_unavailable）。
      operationId: createVM
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateVMRequest"
      responses:
        "201":
          description: 创建请求已受理（PVE 侧异步创建中）
          headers:
            Location:
              $ref: "#/components/headers/Location"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VMResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    get:
      tags: [vms]
      summary: VM 列表（穿透式合并各节点实时状态，含 external 虚拟机）
      description: |
        每个启用节点一次 PVE 调用，与本地元数据合并后按 (node_id, pve_vmid)
        升序稳定排序、内存分页返回（设计 D1/D2）。PVE 上存在而本地无记录的
        虚拟机以 external 条目并入（id 为合成标识 ext-{nodeID}-{vmid}，
        uuid/created_at/updated_at 为空字符串，source 为 external）。
        查询失败或被禁用/移除的节点不出现在 vms 中，而是记录在 warnings
        （Node 为节点名，error 为脱敏原因）。X-Total-Count 为合并后条目
        总数（含 external，剔除故障/禁用节点的虚拟机），与本地 vms 行数
        不再相等。
      operationId: listVMs
      parameters:
        - $ref: "#/components/parameters/QueryLimit"
        - $ref: "#/components/parameters/QueryOffset"
      responses:
        "200":
          description: 分页后的 VM 列表（warnings 恒为数组）
          headers:
            X-Total-Count:
              $ref: "#/components/headers/XTotalCount"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VMListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"

  /vms/import:
    post:
      tags: [vms]
      summary: 认领已有 VM（原导入）
      description: |
        将 PVE 节点上已有的虚拟机认领为托管虚拟机：校验区域/节点/幂等性，
        读取 PVE 配置提取规格，按请求可选分配 IP（ip 为 IP 地址字符串，
        不传则不分配 IP，虚拟机网络由 PVE 侧配置决定）。认领成功后该虚拟机
        出现在列表与详情中，source 为 claimed；不修改 PVE 侧配置。

        错误场景：400 参数非法（含 ip 格式非法）；404 区域/节点不存在
        （not_found）或 PVE 上无此 VM（vm_not_found_on_node）；409 已托管
        （vm_already_managed）或指定 IP 不可用（ip_exhausted）；503 节点
        不可达/禁用（node_unavailable）。
      operationId: importVM
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportVMRequest"
      responses:
        "201":
          description: 认领成功（source 为 claimed；Location 指向详情）
          headers:
            Location:
              $ref: "#/components/headers/Location"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VMListItem"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /vms/{id}:
    get:
      tags: [vms]
      summary: VM 详情（穿透实时状态）
      description: |
        :id 为数字本地行 id 或 external 合成标识 ext-{nodeID}-{vmid}（格式
        非法返回 400）。数字 id：本地元数据 + PVE 实时状态；external 标识：
        实时读取该节点 PVE 状态，返回实时状态与 PVE 摘要规格，本地元数据
        字段（uuid/created_at/updated_at）为空。PVE 节点查询失败（节点不可达、
        被禁用或已被移除）返回 503 node_unavailable，不会伪装成 creating；
        节点可达但 VM 已从 PVE 移除返回 404 vm_not_found_on_node。
      operationId: getVM
      parameters:
        - $ref: "#/components/parameters/PathVMID"
      responses:
        "200":
          description: 本地元数据 + PVE 实时状态
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VMListItem"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    patch:
      tags: [vms]
      summary: 升降配（部分更新）
      description: |
        JSON Merge Patch 语义：仅应用请求体出现的字段，缺失或 null 的字段保留
        现值（先改 PVE 再改本地行）。磁盘只增，缩小返回 422 disk_shrink_not_allowed。
        响应为完整 VM（穿透实时状态），与 GET /vms/:id 同形。

        错误场景：409 VM 尚不可操作（vm_not_ready），并发规格修改
        （乐观锁冲突，repository.ErrSpecConflict）同样返回 409 conflict；
        422 磁盘缩小（disk_shrink_not_allowed）；503 节点查询失败（node_unavailable）。
      operationId: resizeVM
      parameters:
        - $ref: "#/components/parameters/PathID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResizeRequest"
      responses:
        "200":
          description: 变更后的完整 VM（穿透状态）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VMListItem"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    delete:
      tags: [vms]
      summary: 销毁 VM（同步，幂等）
      description: |
        :id 支持数字本地行 id 与 external 合成标识 ext-{nodeID}-{vmid}
        （格式非法返回 400 invalid_vm_id）。

        数字 id：PVE 侧删除（含 purge）→ 释放 IP → 删本地记录，同步完成后
        返回 204；本地行已不存在返回 404 not_found；PVE 侧 VM 已不存在视为
        已销毁，仅执行本地清理（幂等）。

        ext- 标识：直接销毁 PVE VM（无本地行/IP 清理）；PVE 侧 VM 不存在
        返回 404 vm_not_found_on_node。PVE 已受理但操作记录写失败返回 500
        operation_log_failed。
      operationId: destroyVM
      parameters:
        - $ref: "#/components/parameters/PathVMRef"
      responses:
        "204":
          description: 销毁成功，无响应体
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /vms/{id}/start:
    post:
      tags: [vms]
      summary: 启动 VM（异步派发）
      description: |
        :id 支持数字本地行 id 与 external 合成标识 ext-{nodeID}-{vmid}
        （格式非法返回 400 invalid_vm_id）。本地行不存在返回 404 not_found；
        external 目标在节点 PVE 上不存在返回 404 vm_not_found_on_node。
        本地行尚不可操作（未供给完成，或 PVE 对端已不存在）返回 409
        vm_not_ready；PVE 调用失败按全局兜底返回 500 internal_error；
        PVE 已受理但操作记录写失败返回 500 operation_log_failed。
      operationId: startVM
      parameters:
        - $ref: "#/components/parameters/PathVMRef"
      responses:
        "202":
          description: 已受理；Location 指向状态终结点 GET /vms/{id}（数字与 external 标识均可）
          headers:
            Location:
              $ref: "#/components/headers/Location"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptedResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /vms/{id}/stop:
    post:
      tags: [vms]
      summary: 关闭 VM（ACPI 优雅关机，异步派发）
      description: |
        :id 支持数字本地行 id 与 external 合成标识 ext-{nodeID}-{vmid}
        （格式非法返回 400 invalid_vm_id）。本地行不存在返回 404 not_found；
        external 目标在节点 PVE 上不存在返回 404 vm_not_found_on_node。
        本地行尚不可操作（未供给完成，或 PVE 对端已不存在）返回 409
        vm_not_ready；PVE 调用失败按全局兜底返回 500 internal_error；
        PVE 已受理但操作记录写失败返回 500 operation_log_failed。
      operationId: stopVM
      parameters:
        - $ref: "#/components/parameters/PathVMRef"
      responses:
        "202":
          description: 已受理；Location 指向状态终结点 GET /vms/{id}（数字与 external 标识均可）
          headers:
            Location:
              $ref: "#/components/headers/Location"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptedResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /vms/{id}/restart:
    post:
      tags: [vms]
      summary: 重启 VM（异步派发）
      description: |
        :id 支持数字本地行 id 与 external 合成标识 ext-{nodeID}-{vmid}
        （格式非法返回 400 invalid_vm_id）。本地行不存在返回 404 not_found；
        external 目标在节点 PVE 上不存在返回 404 vm_not_found_on_node。
        本地行尚不可操作（未供给完成，或 PVE 对端已不存在）返回 409
        vm_not_ready；PVE 调用失败按全局兜底返回 500 internal_error；
        PVE 已受理但操作记录写失败返回 500 operation_log_failed。
      operationId: restartVM
      parameters:
        - $ref: "#/components/parameters/PathVMRef"
      responses:
        "202":
          description: 已受理；Location 指向状态终结点 GET /vms/{id}（数字与 external 标识均可）
          headers:
            Location:
              $ref: "#/components/headers/Location"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptedResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /vms/{id}/operations:
    get:
      tags: [vms]
      summary: 查询 VM 操作记录（审计轨迹，按时间倒序分页）
      description: |
        返回该 VM 的生命周期操作记录（启动/停止/重启/销毁，每次 PVE 受理
        或失败各一条），按时间倒序分页。:id 支持数字本地行 id（本地行不存在
        返回 404 not_found）与 external 合成标识 ext-{nodeID}-{vmid}（直接
        按 node+vmid 查询，不校验 VM 当前是否存在：记录是审计历史，PVE 侧
        可能已销毁该 VM）。格式非法返回 400 invalid_vm_id。分页语义与列表
        一致：limit 默认 25 上限 100，X-Total-Count 报告匹配总数。
      operationId: listVMOperations
      parameters:
        - $ref: "#/components/parameters/PathVMRef"
        - $ref: "#/components/parameters/QueryLimit"
        - $ref: "#/components/parameters/QueryOffset"
      responses:
        "200":
          description: 分页后的操作记录（按时间倒序）
          headers:
            X-Total-Count:
              $ref: "#/components/headers/XTotalCount"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VMOperationsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

components:
  parameters:
    PathID:
      name: id
      in: path
      required: true
      description: 资源 ID（正整数）
      schema:
        type: integer
        format: int64
        minimum: 1
    PathVMID:
      name: id
      in: path
      required: true
      description: |
        VM 标识：正整数本地行 id，或 external 合成标识 ext-{nodeID}-{vmid}
        （nodeID 为本地 pve_nodes.id，vmid 为 PVE 侧 VMID，均为无前导零的
        正整数；external 虚拟机详情实时读取 PVE 状态，本地元数据字段为空；
        ext- 标识指向已托管的 VM 时按本地形态返回）。
        格式非法返回 400（bad_request / invalid_vm_id）。
      schema:
        type: string
        pattern: ^([1-9][0-9]*|ext-[1-9][0-9]*-[1-9][0-9]*)$
        example: ext-3-100
    PathZoneID:
      name: zone_id
      in: path
      required: true
      description: 区域 ID（正整数）
      schema:
        type: integer
        format: int64
        minimum: 1
    QueryLimit:
      name: limit
      in: query
      description: 每页条数；默认 25，上限 100，超出会被服务端截断，负数/非数字返回 400
      schema:
        type: integer
        format: int32
        minimum: 0
        default: 25
    QueryOffset:
      name: offset
      in: query
      description: 跳过条数；默认 0，负数/非数字返回 400
      schema:
        type: integer
        format: int32
        minimum: 0
        default: 0
    QueryZoneID:
      name: zone_id
      in: query
      description: 按区域过滤（正整数；格式非法返回 400）
      schema:
        type: integer
        format: int64
        minimum: 1
    PathVMRef:
      name: id
      in: path
      required: true
      description: |
        VM 标识：正整数本地行 id，或 external 合成标识 ext-{nodeID}-{vmid}
        （nodeID 为本地 pve_nodes.id，vmid 为 PVE 侧 VMID，均为无前导零的
        正整数；external 条目以合成标识呈现于列表与详情）。格式非法返回
        400 invalid_vm_id。
      schema:
        type: string
        pattern: ^([1-9][0-9]*|ext-[1-9][0-9]*-[1-9][0-9]*)$
        example: ext-3-100

  headers:
    XTotalCount:
      description: 过滤后（分页前）的总条数
      schema:
        type: integer
        format: int64
    XMSErrorCode:
      description: 错误码镜像（与响应体 code 一致，客户端可只读该头判断错误类型）
      schema:
        type: string
    Location:
      description: 新资源或状态终结点的路径（相对路径）
      schema:
        type: string
        format: uri-reference
    Allow:
      description: 405 响应中该路径允许的 HTTP 方法列表
      schema:
        type: string

  responses:
    BadRequest:
      description: 请求参数非法（bad_request / invalid_vm_id；也用于 image_not_available_in_zone）
      headers:
        x-ms-error-code:
          $ref: "#/components/headers/XMSErrorCode"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
          example:
            error:
              code: bad_request
              message: invalid limit query parameter
    NotFound:
      description: 资源不存在（not_found / vm_not_found_on_node），或路径未匹配任何路由的全局 404 兜底（not_found）
      headers:
        x-ms-error-code:
          $ref: "#/components/headers/XMSErrorCode"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
          example:
            error:
              code: not_found
              message: vm 42 not found
    Conflict:
      description: 与现有状态冲突（conflict / ip_exhausted / vm_not_ready / vm_already_managed）
      headers:
        x-ms-error-code:
          $ref: "#/components/headers/XMSErrorCode"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
          example:
            error:
              code: conflict
              message: ip pool network overlaps an existing pool
    Unprocessable:
      description: 语义正确但被业务规则拒绝（unprocessable_entity / disk_shrink_not_allowed）
      headers:
        x-ms-error-code:
          $ref: "#/components/headers/XMSErrorCode"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
          example:
            error:
              code: disk_shrink_not_allowed
              message: disk size cannot be reduced
    ServiceUnavailable:
      description: 服务或依赖不可用（service_unavailable / node_unavailable）
      headers:
        x-ms-error-code:
          $ref: "#/components/headers/XMSErrorCode"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
          example:
            error:
              code: node_unavailable
              message: no available node
    InternalError:
      description: 服务器内部错误（internal_error / operation_log_failed，统一兜底，不暴露内部细节）
      headers:
        x-ms-error-code:
          $ref: "#/components/headers/XMSErrorCode"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
          example:
            error:
              code: internal_error
              message: internal server error
    # MethodNotAllowed 是全局 405 兜底契约的机器可读文档
    #（api/router.go registerErrorRoutes 与 docs/api-errors.md 中
    # method_not_allowed 表项），不挂载在任何具体路径下，故无引用
    #（no-unused-components 豁免记录于 .redocly.lint-ignore.yaml）。
    MethodNotAllowed:
      description: 路径存在但方法未注册（method_not_allowed，全局兜底，带 Allow 头）
      headers:
        Allow:
          $ref: "#/components/headers/Allow"
        x-ms-error-code:
          $ref: "#/components/headers/XMSErrorCode"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
          example:
            error:
              code: method_not_allowed
              message: method not allowed

  schemas:
    ErrorDetail:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: 稳定的机器可读错误码（客户端只可依赖 code）
          enum:
            - bad_request
            - not_found
            - method_not_allowed
            - conflict
            - unprocessable_entity
            - internal_error
            - service_unavailable
            - dependency_failed
            - node_unavailable
            - ip_exhausted
            - vm_not_ready
            - disk_shrink_not_allowed
            - image_not_available_in_zone
            - vm_already_managed
            - vm_not_found_on_node
            - invalid_vm_id
            - operation_log_failed
        message:
          type: string
          description: 仅供人阅读，不可被程序解析
    ErrorBody:
      type: object
      required: [error]
      properties:
        error:
          $ref: "#/components/schemas/ErrorDetail"

    HealthResponse:
      type: object
      required: [status, database]
      properties:
        status:
          type: string
          description: ok（正常）或 degraded（503）
          enum: [ok, degraded]
        database:
          type: string
          description: up 或 down
          enum: [up, down]

    ZoneCreateRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          description: 区域名称（唯一）
          example: cn-north-1

    ZoneResponse:
      type: object
      required: [id, name, created_at, nodes]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        created_at:
          type: string
          format: date-time
        nodes:
          type: array
          description: 该区域全部节点（恒为数组，创建时为空数组）
          items:
            $ref: "#/components/schemas/NodeResponse"

    NodeRequest:
      type: object
      required: [name, host, api_user, api_token]
      properties:
        name:
          type: string
          description: 节点名（区域内唯一）
        pve_name:
          type: string
          description: PVE 集群节点名，可选；缺省时登记自动探测
        host:
          type: string
          description: 节点主机地址，可携带 :port 端口后缀，缺省 8006
        api_user:
          type: string
          description: PVE API 用户，如 spark@pve
        api_token:
          type: string
          description: PVE API token 完整 secret；更新时为空字符串表示保留原密钥
        enabled:
          type: boolean
          description: 是否启用；缺省为 true

    NodeResponse:
      type: object
      required: [id, zone_id, name, pve_name, host, port, api_user, api_token_set, enabled, created_at]
      properties:
        id:
          type: integer
          format: int64
        zone_id:
          type: integer
          format: int64
        name:
          type: string
        pve_name:
          type: string
          description: PVE 集群节点名，空值表示沿用业务名 name
        host:
          type: string
          description: 节点主机地址（纯地址，端口见 port 字段）
        port:
          type: integer
          minimum: 1
          maximum: 65535
          description: 节点 API 端口，默认 8006
        api_user:
          type: string
        api_token_set:
          type: boolean
          description: 是否已存储 API token（token 本身永不返回）
        enabled:
          type: boolean
        created_at:
          type: string
          format: date-time

    NodeStatusResponse:
      type: object
      required: [id, zone_id, name, pve_name, host, port, api_user, api_token_set, enabled, created_at, status]
      properties:
        id:
          type: integer
          format: int64
          description: 本地 pve_nodes.id
        zone_id:
          type: integer
          format: int64
          description: 所属区域 ID
        name:
          type: string
          description: 节点业务名
        pve_name:
          type: string
          description: PVE 集群节点名，空值表示沿用业务名 name
        host:
          type: string
          description: 节点主机地址（纯地址，端口见 port 字段）
        port:
          type: integer
          minimum: 1
          maximum: 65535
          description: 节点 API 端口，默认 8006
        api_user:
          type: string
          description: PVE API 用户，如 spark@pve
        api_token_set:
          type: boolean
          description: 是否已存储 API token（token 本身永不返回）
        enabled:
          type: boolean
          description: 是否启用
        created_at:
          type: string
          format: date-time
          description: 节点登记时间
        status:
          $ref: "#/components/schemas/NodeStatusField"

    NodeStatusField:
      type: object
      required: [status, uptime_seconds, pve_version, kernel_version, cpu, memory, disk, network, net_io]
      properties:
        status:
          type: string
          description: PVE 节点在线状态（如 online/offline/unknown；PVE 9 无该字段，请求成功时恒为 online）
        uptime_seconds:
          type: integer
          format: int64
          description: 节点在线时长（秒）
        pve_version:
          type: string
          description: PVE 版本号，如 8.2.4 / pve-manager/9.1.1/1（PVE 9 的 pveversion 字段，7/8 为 version）
        kernel_version:
          type: string
          description: 内核版本，如 6.8.4-2-pve
        cpu:
          $ref: "#/components/schemas/NodeCPUStatus"
        memory:
          $ref: "#/components/schemas/NodeMemoryStatus"
        disk:
          $ref: "#/components/schemas/NodeDiskStatus"
        network:
          type: array
          description: 网络接口列表（接口信息，不含接口级流量）
          items:
            $ref: "#/components/schemas/NodeNetStatus"
        net_io:
          $ref: "#/components/schemas/NodeNetIO"

    NodeCPUStatus:
      type: object
      required: [cores, usage, loadavg]
      properties:
        cores:
          type: integer
          format: int32
          description: CPU 核数（PVE 9 取 cpuinfo.cpus，7/8 取 cpus 或 maxcpu）
        usage:
          type: number
          format: float
          minimum: 0
          maximum: 1
          description: CPU 使用率（0-1 小数，PVE 原文）
        loadavg:
          type: array
          description: 系统负载（PVE 原文，字符串数组，透传不数值化）
          items:
            type: string

    NodeMemoryStatus:
      type: object
      required: [total, used, usage]
      properties:
        total:
          type: integer
          format: int64
          description: 总内存（字节；PVE 9 取 memory.total，7/8 取 maxmem）
        used:
          type: integer
          format: int64
          description: 已用内存（字节；PVE 9 取 memory.used，7/8 取 mem）
        usage:
          type: number
          format: float
          minimum: 0
          maximum: 1
          description: 内存使用率（0-1 小数）

    NodeDiskStatus:
      type: object
      required: [total, used, usage]
      properties:
        total:
          type: integer
          format: int64
          description: 根分区总容量（字节；PVE 7 取 maxrootfs，8/9 取 rootfs.total）
        used:
          type: integer
          format: int64
          description: 根分区已用（字节；rootfs.used 或 PVE 7 裸数字）
        usage:
          type: number
          format: float
          minimum: 0
          maximum: 1
          description: 根分区使用率（0-1 小数）

    NodeNetStatus:
      type: object
      required: [iface, type, address, active]
      properties:
        iface:
          type: string
          description: 接口名，如 eth0
        type:
          type: string
          description: 接口类型（如 eth、bridge、lo）
        address:
          type: string
          description: 接口地址（如 192.168.1.10）
        active:
          type: boolean
          nullable: true
          description: 接口是否活跃（PVE 返回布尔或数字 1/0，统一输出 boolean）；PVE 未返回时为 null

    NodeNetIO:
      type: object
      required: [net_in, net_out]
      properties:
        net_in:
          type: number
          format: float
          description: 节点当前接收吞吐（bytes/s，取自 PVE rrddata 最近采样点）
        net_out:
          type: number
          format: float
          description: 节点当前发送吞吐（bytes/s，取自 PVE rrddata 最近采样点）

    CreatePoolRequest:
      type: object
      required: [zone_id, name, network_cidr, gateway, dns]
      properties:
        zone_id:
          type: integer
          format: int64
          description: 所属区域（handler 校验必填，<=0 返回 400）
        name:
          type: string
        network_cidr:
          type: string
          format: ipv4-cidr
          description: 网段，如 10.9.0.0/24（自动展开为逐地址记录）
        gateway:
          type: string
          format: ipv4
        dns:
          type: string
          description: DNS 服务器，如 1.1.1.1

    Pool:
      type: object
      required: [id, zone_id, name, network_cidr, gateway, dns, created_at]
      properties:
        id:
          type: integer
          format: int64
        zone_id:
          type: integer
          format: int64
        name:
          type: string
        network_cidr:
          type: string
          format: ipv4-cidr
        gateway:
          type: string
          format: ipv4
        dns:
          type: string
        created_at:
          type: string
          format: date-time

    SetPoolNodesRequest:
      type: object
      required: [node_ids]
      properties:
        node_ids:
          type: array
          description: 白名单节点 ID 列表（整体替换）
          items:
            type: integer
            format: int64

    StorageTypeRequest:
      type: object
      required: [name, display_name, pve_storage]
      properties:
        name:
          type: string
          description: 对外抽象名（唯一），如 ssd
        display_name:
          type: string
          description: 展示名
        pve_storage:
          type: string
          description: 真实 PVE 存储名，如 local-ssd

    StorageType:
      type: object
      required: [id, name, display_name, pve_storage, created_at]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        display_name:
          type: string
        pve_storage:
          type: string
        created_at:
          type: string
          format: date-time

    ImageRequest:
      type: object
      required: [name, default_user, download_url]
      properties:
        name:
          type: string
          description: 镜像名（唯一），如 debian-12-cloud
        default_user:
          type: string
          description: 默认登录用户，如 debian
        download_url:
          type: string
          format: uri
          description: |
            镜像下载地址（http/https URL，必填）：镜像文件由目标 PVE 节点
            代发下载，服务端统一校验协议与 host（非 http(s) 拒绝）；下载
            文件名取自 URL 路径尾段，用于节点存储内容扫描匹配。

    Image:
      type: object
      required: [id, name, default_user, download_url, created_at]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        default_user:
          type: string
        download_url:
          type: string
          format: uri
          description: 镜像下载地址（http/https URL）
        created_at:
          type: string
          format: date-time

    NodeImageStatus:
      type: object
      required: [node_id, node_name, pve_name, downloaded]
      properties:
        node_id:
          type: integer
          format: int64
          description: 本地 pve_nodes.id
        node_name:
          type: string
          description: 节点业务名（pve_nodes.name）
        pve_name:
          type: string
          description: 节点在 PVE 集群中的节点名；为空表示与 node_name 相同（存量数据）
        downloaded:
          type: boolean
          description: 该节点上是否已存在该镜像文件（扫描失败降级为 false，不拖垮整个请求）
        volid:
          type: string
          description: 匹配到的卷 ID（如 local:import/debian.qcow2）；未匹配或节点扫描失败时省略

    ImageZoneItem:
      type: object
      required: [image, nodes]
      properties:
        image:
          $ref: "#/components/schemas/Image"
        nodes:
          type: array
          description: 该区域各启用节点上的镜像存在状态（与节点 id 升序对齐）
          items:
            $ref: "#/components/schemas/NodeImageStatus"

    ImageDownloadRequest:
      type: object
      description: |
        node_ids 与 zone_id 二选一指定下载目标：node_ids 为显式节点列表
        （重复 id 去重），zone_id 为区域全部启用节点。两者同时提供或都
        不提供返回 400 bad_request。
      properties:
        node_ids:
          type: array
          description: 目标节点 ID 列表（与 zone_id 互斥）
          items:
            type: integer
            format: int64
        zone_id:
          type: integer
          format: int64
          description: 目标区域 ID（与 node_ids 互斥）

    ImageOperation:
      type: object
      required: [id, image_id, node_id, action, result, created_at, updated_at]
      properties:
        id:
          type: integer
          format: int64
        image_id:
          type: integer
          format: int64
        node_id:
          type: integer
          format: int64
        action:
          type: string
          description: 操作动作
          enum: [download]
        result:
          type: string
          description: 操作结果：running 已受理执行中；success/failed 为终态
          enum: [running, success, failed]
        error_message:
          type: string
          description: 失败原因（脱敏）；仅失败时出现
        upid:
          type: string
          description: PVE 受理后返回的任务 ID；尚未受理时省略
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateVMRequest:
      type: object
      required: [name, cpu, mem_mb, disk_gb, image_id, storage_type_id, zone_id, password]
      properties:
        name:
          type: string
          description: VM 名称
        cpu:
          type: integer
          format: int32
          minimum: 1
          description: vCPU 数
        mem_mb:
          type: integer
          format: int64
          minimum: 1
          description: 内存（MB）
        disk_gb:
          type: integer
          format: int64
          minimum: 1
          description: 磁盘（GB）
        image_id:
          type: integer
          format: int64
        storage_type_id:
          type: integer
          format: int64
        zone_id:
          type: integer
          format: int64
        password:
          type: string
          description: cloud-init 注入密码（仅创建时使用，不随响应返回）

    ImportVMRequest:
      type: object
      required: [zone_id, node_id, pve_vmid]
      properties:
        zone_id:
          type: integer
          format: int64
          description: 区域 ID（必填）
        node_id:
          type: integer
          format: int64
          description: 节点 ID（必填）
        pve_vmid:
          type: integer
          format: int64
          description: PVE 侧 VMID（必填）
        ip:
          type: string
          description: |
            IP 地址（IPv4/IPv6 均可），可选；不传则不分配 IP（本地 ip_id
            为空，虚拟机网络由 PVE 侧配置决定）。传入时按区域 IP 池中
            CIDR 包含该地址且节点在白名单内的池精确占用，不可用返回 409
            ip_exhausted。
        name:
          type: string
          maxLength: 128
          description: 认领后的 VM 名称，可选；空则取 PVE 配置名。名称须匹配 ^[A-Za-z0-9_][A-Za-z0-9_.\-]*$；PVE 配置名超长时截断到 128 字符而非拒绝

    VMResponse:
      type: object
      required: [id, uuid, name, cpu, mem_mb, disk_gb, zone_id, node_id, status, source, created_at, updated_at]
      properties:
        id:
          type: integer
          format: int64
        uuid:
          type: string
          format: uuid
        name:
          type: string
        cpu:
          type: integer
          format: int32
        mem_mb:
          type: integer
          format: int64
        disk_gb:
          type: integer
          format: int64
        image_id:
          type: integer
          format: int64
          # 可空：导入的 VM 无镜像关联时省略
          description: 可为空（导入的 VM 无镜像关联）
        storage_type_id:
          type: integer
          format: int64
          # 可空：导入的 VM 无存储类型关联时省略
          description: 可为空（导入的 VM 无存储类型关联）
        zone_id:
          type: integer
          format: int64
        node_id:
          type: integer
          format: int64
        pve_vmid:
          type: integer
          format: int64
          description: PVE 侧 VMID；PVE 侧尚未创建时省略
        ip:
          type: string
          format: ipv4
          description: 分配的 IP；尚未分配时省略
        status:
          type: string
          description: creating/failed 为本地过渡状态；ready 及以后为 PVE 穿透状态
          example: creating
        source:
          type: string
          description: |
            虚拟机来源：spark_created（由 Spark 镜像创建）、claimed（已认领的
            外部虚拟机）、external（PVE 上存在而本地无记录，列表与详情均可
            呈现；由 PVE 全量虚拟机与本地记录实时比对得出，不落库）
          enum: [spark_created, claimed, external]
        provision_error:
          type: string
          description: 异步供给链失败原因（仅失败时出现）
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    VMListItem:
      description: |
        透传 VM 负载：VMResponse 元数据 + PVE 实时运行部分。external 条目
        （source=external）id 为合成标识 ext-{nodeID}-{vmid}（字符串），
        uuid/created_at/updated_at 返回空字符串，规格取 PVE 摘要值；
        列表与详情（GET /vms/{id} 的 ext- 标识）均以此形态呈现。
      allOf:
        - $ref: "#/components/schemas/VMResponse"
        - type: object
          properties:
            id:
              description: |
                本地行（source 为 spark_created/claimed）为数字本地行 id；
                external 条目（source=external）为合成标识 ext-{nodeID}-{vmid}
                （nodeID 为本地 pve_nodes.id，vmid 为 PVE 侧 VMID）
              oneOf:
                - type: integer
                  format: int64
                  minimum: 1
                - type: string
                  pattern: ^ext-[1-9][0-9]*-[1-9][0-9]*$
                  example: ext-3-100
            uuid:
              type: string
              format: uuid
              description: external 条目（source=external）返回空字符串
            created_at:
              type: string
              format: date-time
              description: 本地行时间戳；external 条目（source=external）返回空字符串
            updated_at:
              type: string
              format: date-time
              description: 本地行时间戳；external 条目（source=external）返回空字符串
            cpu_usage:
              type: number
              format: float
              description: PVE 实时 CPU 使用率；无 PVE 对端或停机时省略
            mem:
              type: integer
              format: int64
              description: 实时内存（字节）；同上省略
            maxmem:
              type: integer
              format: int64
              description: 最大内存（字节）；同上省略
            disk:
              type: integer
              format: int64
              description: 实时磁盘用量（字节）；同上省略
            maxdisk:
              type: integer
              format: int64
              description: 最大磁盘（字节）；同上省略
            uptime:
              type: integer
              format: int64
              description: 运行时长（秒）；同上省略

    NodeWarning:
      type: object
      required: [node, error]
      properties:
        node:
          type: string
          description: 查询失败或被禁用/移除的 PVE 节点名（绝不暴露内部节点 id）
        error:
          type: string
          description: 失败原因（已脱敏，不包含内部地址/API 路径等细节）

    VMListResponse:
      type: object
      required: [vms, warnings]
      properties:
        vms:
          type: array
          items:
            $ref: "#/components/schemas/VMListItem"
        warnings:
          type: array
          description: 节点查询失败告警（恒为数组，无失败时为空数组）
          items:
            $ref: "#/components/schemas/NodeWarning"

    ResizeRequest:
      type: object
      description: 至少一个字段必须出现；缺失或 null 的字段保留现值
      minProperties: 1
      properties:
        cpu:
          type: integer
          format: int32
          minimum: 1
        mem_mb:
          type: integer
          format: int64
          minimum: 1
        disk_gb:
          type: integer
          format: int64
          minimum: 1
          description: 只增不减；小于当前值返回 422 disk_shrink_not_allowed

    AcceptedResponse:
      type: object
      required: [accepted]
      properties:
        accepted:
          type: boolean
          description: |
            恒为 true；实际结果通过 Location 指向的 GET /vms/{id} 观察
            （数字与 external 标识均可，external 详情实时读取 PVE 状态）
          example: true

    VMOperation:
      type: object
      required: [id, node_id, pve_vmid, action, result, created_at]
      properties:
        id:
          type: integer
          format: int64
          description: 操作记录 ID
        node_id:
          type: integer
          format: int64
          description: PVE 节点（本地 pve_nodes.id）
        pve_vmid:
          type: integer
          format: int64
          description: PVE 侧 VMID
        action:
          type: string
          description: 操作动作
          enum: [start, stop, reboot, destroy]
        result:
          type: string
          description: accepted=PVE 已受理；failed=PVE 返回错误（error_message 记录原因）
          enum: [accepted, failed]
        error_message:
          type: string
          description: 失败原因（已脱敏）；受理成功时省略
        created_at:
          type: string
          format: date-time
          description: 操作发生时间

    VMOperationsResponse:
      type: object
      required: [operations]
      properties:
        operations:
          type: array
          description: 该 VM 的操作记录（按时间倒序）
          items:
            $ref: "#/components/schemas/VMOperation"

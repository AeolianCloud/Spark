# PR 自动打标签配置（actions/labeler）
# 作用：根据变更路径自动为 PR 添加 area 标签，便于按模块筛选审查
labels:
  - label: "区域:API"
    files:
      - "api/**"
  - label: "区域:服务层"
    files:
      - "service/**"
  - label: "区域:数据访问层"
    files:
      - "repository/**"
  - label: "区域:数据库"
    files:
      - "database/**"
  - label: "区域:加密"
    files:
      - "crypto/**"
  - label: "区域:PVE客户端"
    files:
      - "pve/**"
  - label: "区域:前端"
    files:
      - "web/**"
  - label: "区域:端到端测试"
    files:
      - "e2e/**"
  - label: "区域:接口契约"
    files:
      - "docs/openapi.yaml"
      - "api/swagger/openapi.yaml"
      - "docs/api-errors.md"
  - label: "区域:OpenSpec"
    files:
      - "openspec/**"
  - label: "区域:文档"
    files:
      - "docs/**"
      - "*.md"

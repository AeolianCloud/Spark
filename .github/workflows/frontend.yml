# 前端（web/）CI：契约一致性保障 + 类型/静态检查 + 静态构建验证
#
# 契约红线：docs/openapi.yaml 是唯一事实来源，前端 client 由其生成且生成物入库。
# api:check 重新生成 client 并与已提交版本 diff，diff 非空即失败——
# 契约变更未同步生成 client 的 PR 不允许合并（见 AGENTS.md 接口契约同步红线）。
#
# 注意：不做 paths 过滤（对全部 push/PR 运行）——分支保护要求 build 检查
# 必须存在且通过，若按路径过滤则纯文档/配置 PR 无 build 检查，永远无法合并
#（Mergify 的 check-success 条件同理失效）。
name: frontend

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      # 安装依赖（版本锁定于 package-lock.json）
      - name: 安装依赖
        run: npm ci

      # 重新生成 client 并与已提交版本 diff 校验（未同步契约的变更被拒绝）
      - name: 契约一致性校验（client 与 docs/openapi.yaml）
        run: npm run api:check

      - name: 类型检查
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # 静态构建验证（SPA 产物，可被 nginx 静态托管）
      - name: 静态构建
        run: npm run generate
